<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfólio Coca-Cola Bandeirantes</title>
<meta name="theme-color" content="#E4002B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E4002B; --red-dk:#B80023; --ink:#23262B; --ink-2:#555B64; --ink-3:#8A9099;
  --bg:#F3F4F6; --surface:#FFFFFF; --line:#E3E5E9; --line-2:#D0D4DA; --chip:#F0F1F4;
  --ok:#1E7B34; --warn:#B26A00; --focus:#1f6feb;
  --r-lg:14px; --r-md:10px; --r-sm:6px;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#ECEDEF; --ink-2:#B9BDC4; --ink-3:#8A9099; --bg:#15171A; --surface:#1E2125; --line:#2C3036; --line-2:#3A3F46; --chip:#262A30;
}}
:root[data-theme="dark"]{--ink:#ECEDEF; --ink-2:#B9BDC4; --ink-3:#8A9099; --bg:#15171A; --surface:#1E2125; --line:#2C3036; --line-2:#3A3F46; --chip:#262A30;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:inherit}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:12px 20px}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.mark-disc{width:36px;height:36px;border-radius:50%;background:var(--red);display:grid;place-items:center;color:#fff;font:700 18px/1 var(--f-display)}
.mark-t{font:700 21px/1 var(--f-display);letter-spacing:.2px}
.mark-s{font:500 13px/1.2 var(--f-body);color:var(--ink-3)}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;height:42px;border:1px solid var(--line-2);border-radius:999px;padding:0 16px 0 40px;background:var(--bg)}
.search svg{position:absolute;left:14px;top:12px;width:18px;height:18px;color:var(--ink-3)}
.top-act{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--surface);font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn-red{background:var(--red);border-color:var(--red);color:#fff}
.btn-red:hover{background:var(--red-dk);border-color:var(--red-dk)}
.btn-sm{height:32px;padding:0 12px;font-size:14px;border-radius:var(--r-sm)}
.btn-ghost{border-color:transparent;background:transparent}
.count{min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-size:13px;display:inline-grid;place-items:center;padding:0 6px}
.btn-red .count{background:#fff;color:var(--red)}

main{max-width:1320px;margin:0 auto;padding:20px}
.crumbs{font-size:13px;color:var(--ink-3);margin:4px 0 16px;letter-spacing:.2px}
.crumbs a{text-decoration:none}.crumbs a:hover{text-decoration:underline}
.crumbs span{margin:0 8px}

/* brand wall */
.wall-h{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 12px}
h1,h2{font-family:var(--f-display);font-weight:700;margin:0;letter-spacing:.2px}
h1{font-size:40px;line-height:1.05}
h2{font-size:26px;line-height:1.1}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin-bottom:28px}
.wall.compact{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:132px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tile{position:relative;height:88px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);display:grid;place-items:center;padding:10px 12px;text-decoration:none;overflow:hidden}
.tile:hover{border-color:var(--ink-3)}
.tile.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.tile img{max-height:52px;max-width:100%;object-fit:contain}
.tile .wm{font:700 22px/1 var(--f-display);text-align:center;letter-spacing:.3px}
.tile .n{position:absolute;right:8px;bottom:6px;font-size:12px;color:var(--ink-3)}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--bc,var(--line-2))}

/* layout catálogo */
.cat{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:start}
.side{position:sticky;top:84px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;max-height:calc(100vh - 110px);overflow:auto}
.side h3{font:600 17px/1.2 var(--f-display);margin:14px 0 8px;letter-spacing:.3px}
.side h3:first-child{margin-top:0}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:6px 8px;border-radius:var(--r-sm);text-align:left;font-size:15px;color:var(--ink-2)}
.opt:hover{background:var(--chip)}
.opt.on{background:var(--chip);color:var(--ink);font-weight:600}
.opt small{color:var(--ink-3);font-size:13px}
.side-clear{margin-top:12px}
.res-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.res-h .meta{color:var(--ink-3);font-size:14px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;background:var(--chip);border:0;font-size:14px}
.pill b{font-weight:600}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);display:flex;flex-direction:column;overflow:hidden}
.card:hover{border-color:var(--line-2)}
.card-img{aspect-ratio:1/1;display:grid;place-items:center;padding:14px;border:0;background:none;position:relative;width:100%}
.card-img img{max-height:100%;object-fit:contain}
.selo{position:absolute;left:10px;top:10px;font:600 12px/1 var(--f-body);background:var(--ink);color:var(--surface);padding:5px 8px;border-radius:4px}
.card-b{padding:0 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.bchip{align-self:flex-start;font:700 13px/1 var(--f-display);letter-spacing:.4px;color:#fff;background:var(--red);padding:5px 10px;border-radius:999px;text-decoration:none}
.card-n{font-weight:600;font-size:16px;line-height:1.25;border:0;background:none;padding:0;text-align:left}
.card-n:hover{text-decoration:underline}
.card-m{font-size:13px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap}
.card-f{margin-top:auto;display:flex;gap:8px;padding-top:6px}
.add{flex:1;height:36px;border-radius:var(--r-sm);border:1px solid var(--red);background:var(--surface);color:var(--red);font-weight:600;font-size:14px}
.add.on{background:var(--red);color:#fff}

/* placeholder de embalagem */
.ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--pc)}
.ph svg{height:62%;width:auto}
.ph span{font:600 15px/1 var(--f-display);letter-spacing:.3px;color:var(--ink-3)}

.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:40px;text-align:center;color:var(--ink-2)}
.more{display:flex;justify-content:center;margin:22px 0}

/* brand header */
.bhead{display:grid;grid-template-columns:180px 1fr;gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-bottom:22px;border-top:5px solid var(--bc)}
.bhead .logo{height:110px;display:grid;place-items:center}
.bhead .logo img{max-height:100%;object-fit:contain}
.bhead .logo .wm{font:700 40px/1 var(--f-display);color:var(--bc);text-align:center}
.bhead p{margin:8px 0 0;color:var(--ink-2);max-width:68ch}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,22,25,.55);z-index:50;display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);border-radius:var(--r-lg);width:min(980px,100%);max-height:calc(100vh - 40px);overflow:auto;display:grid;grid-template-columns:1fr 1fr;position:relative}
.m-img{background:var(--bg);display:grid;place-items:center;padding:32px;min-height:380px}
.m-img img{max-height:420px;object-fit:contain}
.m-b{padding:28px 28px 24px;display:flex;flex-direction:column;gap:10px}
.m-b h2{font-size:32px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:16px;margin:4px 0 8px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-weight:500}
.kv .cod{color:var(--red);font-weight:700}
.m-x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);font-size:20px;line-height:1}
.m-act{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.m-act .btn-red{height:46px;padding:0 22px;font-size:16px}

/* seleção */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:60;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.dr-b{flex:1;overflow:auto;padding:8px 18px}
.dr-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.li{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li .th{width:48px;height:48px;display:grid;place-items:center}
.li .th img{max-height:48px}
.li small{color:var(--ink-3)}

/* portal MKT */
.mkt-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--red)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.stat b{display:block;font:700 28px/1.1 var(--f-display)}
.stat span{font-size:14px;color:var(--ink-3)}
.bar{height:6px;background:var(--chip);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tools input,.tools select{height:36px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:0 10px;background:var(--surface)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--ink-3);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td input[type=text],td select,td textarea{width:100%;min-width:120px;height:32px;border:1px solid transparent;border-radius:var(--r-sm);padding:0 8px;background:transparent}
td textarea{height:56px;padding:6px 8px;resize:vertical;min-width:260px}
td input[type=text]:hover,td select:hover,td textarea:hover{border-color:var(--line-2)}
td input[type=text]:focus,td select:focus,td textarea:focus{border-color:var(--focus);background:var(--surface)}
.thumb{width:52px;height:52px;border:1px dashed var(--line-2);border-radius:var(--r-sm);display:grid;place-items:center;background:var(--bg);font-size:11px;color:var(--ink-3);position:relative;overflow:hidden;padding:0}
.thumb img{max-height:48px;max-width:48px;object-fit:contain}
.thumb.wide{width:120px}
.thumb.wide img{max-width:112px}
.sw{position:relative;width:40px;height:22px;display:inline-block}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:var(--line-2);border-radius:11px;transition:background .15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.saved{color:var(--ok);font-size:13px}
.drop{border:2px dashed var(--line-2);border-radius:var(--r-lg);padding:30px;text-align:center;color:var(--ink-2);background:var(--bg)}
.drop.over{border-color:var(--red);background:var(--surface)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:4px;background:var(--chip)}
.tag.ok{background:#E3F2E7;color:var(--ok)}
.tag.warn{background:#FFF1DB;color:var(--warn)}
.tag.no{background:#FDE3E7;color:var(--red-dk)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:14px;color:var(--ink-3)}
.help{color:var(--ink-2);font-size:15px;max-width:72ch;margin:0 0 14px}
.form{display:grid;gap:12px;max-width:560px}
.form label{display:grid;gap:4px;font-weight:600;font-size:14px}
.form input{height:40px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:0 10px;background:var(--surface);font-weight:400}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:var(--r-md);z-index:80;font-size:15px}
.status{padding:60px 20px;text-align:center;color:var(--ink-2)}

@media (max-width:960px){
  .cat{grid-template-columns:1fr}
  .side{position:static;max-height:none}
  .side .grp{display:flex;flex-wrap:wrap;gap:6px}
  .side .opt{width:auto;background:var(--chip);border-radius:999px;padding:6px 12px;gap:6px}
  .side .opt.on{background:var(--ink);color:var(--surface)}
  .modal{grid-template-columns:1fr}
  .m-img{min-height:260px}
  .bhead{grid-template-columns:1fr}
}
@media (max-width:640px){
  .top-in{flex-wrap:wrap;gap:10px}
  .search{order:3;flex-basis:100%;max-width:none}
  .mark-s{display:none}
  h1{font-size:32px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .card-b{padding:0 10px 10px}
  main{padding:14px}
  .top-act .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.pend{position:sticky;top:0;z-index:40;background:#FFF4D6;color:#5C4200;border-bottom:1px solid #EBD48F}
.pend-in{max-width:1320px;margin:0 auto;padding:10px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pend b{font-weight:700}
.gh{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;max-width:none}
.note{background:var(--bg);border-radius:var(--r-md);padding:12px 14px;font-size:14px;color:var(--ink-2)}
.log{font:13px/1.5 ui-monospace,Consolas,monospace;background:var(--bg);border-radius:var(--r-md);padding:10px;max-height:220px;overflow:auto;white-space:pre-wrap}

/* barra de marcas */
.bbar{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:0 0 14px;scrollbar-width:thin}
.bpill{flex:0 0 auto;display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:8px;background:var(--bc);color:#fff;font:700 16px/1 var(--f-display);letter-spacing:.4px;text-transform:uppercase;text-decoration:none;opacity:.92}
.bpill:hover{opacity:1}
.bpill.on{outline:3px solid var(--ink);outline-offset:2px;opacity:1}
/* card horizontal */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.pc{position:relative;display:grid;grid-template-columns:150px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;min-height:200px}
.pc.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.pc-img{border:0;background:var(--surface);padding:14px 10px;display:grid;place-items:center;border-right:1px solid var(--line);position:relative}
.pc-img img{max-height:170px;object-fit:contain}
.pc-img .ph svg{height:110px}
.pc-img .ph span{font-size:13px}
.pc-b{padding:14px 44px 14px 16px;display:flex;flex-direction:column;gap:3px;font-size:15px}
.pc-n{border:0;background:none;padding:0;text-align:left;font-weight:700;font-size:16px;line-height:1.25;margin-bottom:4px}
.pc-n:hover{text-decoration:underline}
.pc-cod{color:var(--ink-3)}
.pc-cod b{color:var(--red)}
.pc-m{color:var(--ink-3)}
.pc-m b{color:var(--ink);font-weight:500}
.pc .bchip{margin-top:auto;font-size:12px;padding:4px 9px}
.ck{position:absolute;right:12px;top:12px;width:26px;height:26px;border-radius:6px;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;padding:0}
.ck.on{background:var(--red);border-color:var(--red)}
.ck.on::after{content:"";width:12px;height:7px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.selall{display:inline-flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font:600 15px/1 var(--f-display);letter-spacing:.3px;text-transform:uppercase}
.selall .ck{position:static;width:20px;height:20px;border-radius:5px}
.selall .ck.on::after{width:9px;height:5px;border-width:2px}
.res-r{display:flex;align-items:center;gap:12px}
/* botão flutuante */
.fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;align-items:center;gap:10px;height:54px;padding:0 20px 0 16px;border-radius:999px;border:0;background:var(--red);color:#fff;font:700 17px/1 var(--f-display);letter-spacing:.3px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.fab svg{width:22px;height:22px}
.fab b{background:#fff;color:var(--red);min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font-size:14px;padding:0 6px}
/* gaveta */
.li .th .ph svg{height:40px}
.li .th .ph span{display:none}
.li .th{overflow:hidden}
.dr-f .btn-red{flex:1 1 100%;justify-content:center;height:46px;font-size:16px}
.dr-msg{font-size:14px;color:var(--ink-2);flex-basis:100%}
@media (max-width:640px){.grid2{grid-template-columns:1fr}.pc{grid-template-columns:118px 1fr;min-height:170px}.pc-img img{max-height:130px}.fab{right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}}

/* logo da marca sempre contido na caixa */
.bhead .logo{height:120px;width:100%;max-width:200px;overflow:hidden;justify-self:center}
.bhead .logo img{max-height:120px;max-width:100%;width:auto;height:auto;object-fit:contain}
.tile img{max-height:52px;max-width:100%;width:auto;height:auto;object-fit:contain}
@media (max-width:960px){.bhead .logo{height:90px}.bhead .logo img{max-height:90px}}

/* ===== identidade Coca-Cola Bandeirantes ===== */
:root{--red:#F40009;--red-dk:#C70008;--ink:#1E1E1E;--ink-2:#333;--ink-3:#5B5F66;--bg:#F3F3F3;--line:#D9D9D9;--line-2:#BDBDBD;--chip:#ECECEC;--dark:#231F20;
  --f-display:"Ubuntu","Segoe UI",Roboto,Arial,sans-serif;--f-body:"Ubuntu","Segoe UI",Roboto,Arial,sans-serif}
body{font-family:var(--f-body)}
h1,h2,.mark-t,.side h3,.stat b,.bchip,.bpill,.selall,.fab,.wm,.tile .wm,.bhead .logo .wm,.ph span{font-family:var(--f-display);font-weight:700;letter-spacing:0}
h1{font-size:34px}
.top{background:var(--red);border-bottom:0;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.top-in{padding:14px 20px}
.blogo{display:flex;align-items:center;gap:16px;text-decoration:none;color:#fff;flex-shrink:0}
.blogo img{height:48px;width:auto}
.blogo span{border-left:1px solid rgba(255,255,255,.55);padding-left:16px;font:700 16px/1.15 var(--f-display)}
.blogo small{display:block;font-weight:400;font-size:13px;opacity:.9}
.top .search input{background:#fff;border:0;color:#1E1E1E;height:44px}
.top .search input::placeholder{color:#777}
.top .search svg{color:#777;top:13px}
.top .btn{border-radius:999px;font-weight:700}
.top .btn-red,.top .btn{background:transparent;border:2px solid #fff;color:#fff}
.top .btn-red:hover,.top .btn:hover{background:#fff;color:var(--red)}
.top .btn-red .count{background:#fff;color:var(--red)}
.top .btn-red:hover .count{background:var(--red);color:#fff}
.top .mono{color:#fff}
.btn{border-radius:999px;font-weight:700}
.btn-red{background:var(--red);border-color:var(--red)}
.hero{background:var(--dark);color:#fff}
.hero-in{max-width:1320px;margin:0 auto;padding:40px 20px 44px;display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:center}
.hero-k{margin:0 0 6px;font-size:14px;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;color:#FF6B6B}
.hero h1{font-size:40px;line-height:1.08;color:#fff}
.hero p.sub{margin:10px 0 22px;font-size:18px;color:#E6E6E6;max-width:56ch}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-cta .btn{height:48px;padding:0 26px;font-size:17px}
.hero-cta .btn-out{background:transparent;border:2px solid #fff;color:#fff}
.hero-cta .btn-out:hover{background:#fff;color:var(--dark)}
.hero-n{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;text-align:center}
.hero-n b{display:block;font:700 48px/1 var(--f-display);color:#fff}
.hero-n span{display:block;margin-top:8px;font-size:16px;color:#E6E6E6}
.wall-h h1{font-size:30px}
.tile{border-width:1px;border-color:var(--line)}
.tile::before{width:6px}
.tile .wm{font-size:20px}
.bpill{border-radius:999px;font-size:14px;font-weight:700;height:36px;padding:0 16px;opacity:1}
.bpill.on{outline:3px solid var(--dark)}
.pc{border-color:var(--line)}
.pc-n{font-size:16px;color:var(--ink)}
.pc-cod b{color:var(--red)}
.side{border-color:var(--line)}
.side h3{font-size:16px;color:var(--ink)}
.opt{color:var(--ink-2)}
.bhead{border-top-width:6px}
.selall{border-radius:999px;font-weight:700;font-size:13px}
.fab{border-radius:999px;font-weight:700;font-size:16px}
.foot{background:var(--dark);color:#E6E6E6;margin-top:40px}
.foot-in{max-width:1320px;margin:0 auto;padding:28px 20px calc(28px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.foot img{height:40px;width:auto}
.foot p{margin:0;font-size:14px}
.foot a{color:#fff;font-weight:700}
@media (max-width:960px){.hero-in{grid-template-columns:1fr}.hero h1{font-size:32px}.hero-n b{font-size:38px}}
@media (max-width:640px){.blogo img{height:38px}.blogo span{display:none}.hero-in{padding:28px 16px}.hero-n span{font-size:13px}}
</style>
</head>

// Comunicação com o backend (Apps Script) — usada pela landing page e pelo admin
var API = (function () {
  var URL_ = window.PORTAL_API || "";
  function configurado() { return /^https:\/\/script\.google(usercontent)?\.com\//.test(URL_); }
  async function get(action) {
    var r = await fetch(URL_ + "?action=" + action + "&t=" + Date.now(), { redirect: "follow" });
    if (!r.ok) throw new Error("Servidor respondeu " + r.status);
    return r.json();
  }
  async function post(acao, dados) {
    var body = Object.assign({ acao: acao, senha: sessionStorage.getItem("portalSenha") || "" }, dados || {});
    var r = await fetch(URL_, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body), redirect: "follow" });
    var j = await r.json();
    if (j.erro) { var e = new Error(j.erro === "senha" ? "Senha incorreta" : j.erro === "ocupado" ? "Outra pessoa está salvando. Tente de novo." : j.erro); e.code = j.erro; throw e; }
    return j;
  }
  return {
    configurado: configurado,
    catalogo: function () { return get("catalogo"); },
    versao: function () { return get("versao").then(function (j) { return j.versao; }); },
    imagem: function (id) { return get("img&id=" + encodeURIComponent(id)); },
    post: post
  };
})();

// imagem: id do Drive, URL completa ou caminho relativo
function imgUrl(v, w) {
  if (!v) return "";
  if (/^(https?:|data:|blob:|img\/|\.\/)/.test(v)) return v;
  return "https://lh3.googleusercontent.com/d/" + v + "=w" + (w || 600);
}
</script>

function route(){var parts=location.hash.replace(/^#\/?/,"").split("/");return {name:parts[0]||"home",arg:decodeURIComponent(parts[1]||"")};}

function heroUpdate(){

  heroUpdate();

  var r=route();
  if(r.name==="produto"){renderCatalog({});var m=$layer.querySelector(".modal");if(!m||m.dataset.cod!==r.arg)openProduct(parseInt(r.arg,10));return;}

function visibleProducts(){return S.products.filter(function(p){var b=S.brands[p.marca];return p.visivel!==false&&(!b||b.visivel!==false);});}
function filtered(base){
  var f=S.f,qs=norm(f.q).trim().split(/\s+/).filter(Boolean);
  return base.filter(function(p){
    if(f.cat&&p.categoria!==f.cat)return false;
    if(f.marca&&p.marca!==f.marca)return false;
    if(f.tipo&&p.tipo!==f.tipo)return false;
    if(f.tam&&p.tamanho!==f.tam)return false;
    if(qs.length){var hay=norm(p.nome+" "+p.nomeCadastro+" "+brandOf(p).nome+" "+p.cod+" "+p.ean+" "+p.dun+" "+p.sabor);for(var i=0;i<qs.length;i++)if(hay.indexOf(qs[i])<0)return false;}
    return true;
  });
}
function sortProducts(arr){
  return arr.slice().sort(function(a,b){
    var ba=S.brands[a.marca],bb=S.brands[b.marca];
    return ((ba&&ba.ordem)||999)-((bb&&bb.ordem)||999)||(b.selo?1:0)-(a.selo?1:0)||(a.imagem?0:1)-(b.imagem?0:1)||String(a.nome).localeCompare(b.nome,"pt");

function openSel(){

      :'<p class="help" style="margin-top:14px">Marque os produtos na caixa do canto de cada card, ou use “Selecionar todos”, para baixar as imagens de uma vez.</p>')+
    '</div><div class="dr-f">'+

      '<span class="dr-msg hidden" id="zipMsg"></span><button class="btn btn-sm" data-export="1" type="button">Baixar planilha</button><button class="btn btn-sm" data-copycods="1" type="button">Copiar códigos</button><button class="btn btn-sm btn-ghost" data-clearsel="1" type="button">Limpar</button>':'')+

function salvarBlob(blob,nome){
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
}
function extDe(mime){return /png/.test(mime)?"png":/webp/.test(mime)?"webp":/svg/.test(mime)?"svg":/gif/.test(mime)?"gif":"jpg";}
function nomeArquivo(p,ext){return (p.cod+" - "+String(p.nome).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w\s().,-]+/g,"").replace(/\s+/g," ").trim()).slice(0,120)+"."+ext;}
function carregarScript(src){return new Promise(function(res,rej){var s=document.createElement("script");s.src=src;s.onload=res;s.onerror=function(){rej(new Error("Não carregou "+src));};document.head.appendChild(s);});}
// busca a imagem original: primeiro direto do Drive; se o navegador bloquear, pelo Apps Script
async function pegarImagem(v){
  if(/^(https?:|img\/|\.\/)/.test(v)){var r0=await fetch(v);var b0=await r0.blob();return {blob:b0,ext:extDe(b0.type)};}
  try{
    var r=await fetch("https://lh3.googleusercontent.com/d/"+v+"=s0",{mode:"cors",referrerPolicy:"no-referrer"});
    if(!r.ok)throw new Error(r.status);var b=await r.blob();if(!/^image\//.test(b.type))throw new Error("tipo");
    return {blob:b,ext:extDe(b.type)};
  }catch(e){
    var j=await API.imagem(v);if(!j||j.erro||!j.base64)throw new Error((j&&j.erro)||"sem imagem");
    var bin=atob(j.base64),u8=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    return {blob:new Blob([u8],{type:j.mime}),ext:extDe(j.mime)};
  }
}
async function baixarZip(btn){
  var items=S.sel.map(function(c){return S.byCod[c];}).filter(function(p){return p&&p.imagem;});
  if(!items.length){toast("Nenhum item selecionado tem imagem ainda");return;}
  var msg=document.getElementById("zipMsg");msg.classList.remove("hidden");btn.disabled=true;
  try{
    if(!window.JSZip){msg.textContent="Preparando…";await carregarScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");}
    var zip=new JSZip(),cache={},ok=0,falha=0;
    for(var i=0;i<items.length;i++){
      var p=items[i];msg.textContent="Baixando imagem "+(i+1)+" de "+items.length+"…";
      try{var r=cache[p.imagem]||(cache[p.imagem]=await pegarImagem(p.imagem));zip.file(nomeArquivo(p,r.ext),r.blob);ok++;}catch(e){falha++;}
    }
    if(!ok)throw new Error("nenhuma imagem pôde ser baixada");
    msg.textContent="Compactando…";
    var blob=await zip.generateAsync({type:"blob"});
    salvarBlob(blob,"portfolio-bandeirantes-"+new Date().toISOString().slice(0,10)+".zip");
    msg.textContent=ok+" imagens baixadas"+(falha?", "+falha+" com erro":"")+".";
  }catch(e){msg.textContent="Não foi possível baixar: "+e.message;}
  btn.disabled=false;
}
async function baixarUma(cod,btn){
  var p=S.byCod[cod];if(!p||!p.imagem)return;
  var t=btn.textContent;btn.textContent="Baixando…";btn.disabled=true;
  try{var r=await pegarImagem(p.imagem);salvarBlob(r.blob,nomeArquivo(p,r.ext));}catch(e){toast("Não foi possível baixar a imagem");}
  btn.textContent=t;btn.disabled=false;
}
function exportSel(){
  var rows=[["Código","Produto","Marca","Categoria","Tamanho","Qtd","EAN","DUN"]];
  S.sel.forEach(function(c){var p=S.byCod[c];if(p)rows.push([p.cod,p.nome,brandOf(p).nome,CATN[p.categoria]||"",p.tamanho,p.qtd,p.ean,p.dun]);});
  var csv="\ufeff"+rows.map(function(r){return r.map(function(v){v=String(v==null?"":v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(";");}).join("\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="meu-portfolio.csv";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}

  if(d.cat!==undefined){location.hash=S.f.cat===d.cat?"#/":"#/categoria/"+d.cat;return;}

  if(d.tam!==undefined){S.f.tam=S.f.tam===d.tam?"":d.tam;S.limit=60;render();return;}
  if(d.clear!==undefined||d.unq!==undefined){if(d.clear!==undefined){S.f.tipo="";S.f.tam="";}if(d.unq!==undefined){S.f.q="";document.getElementById("q").value="";}render();return;}
  if(d.more){S.limit+=60;render();}
});
boot();
})();
